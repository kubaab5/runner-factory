<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meme Merge</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="cv"></canvas>
    <div id="boot">Meme Merge</div>
    <div id="hud" class="hide">
      <div id="top">
        <div class="box"><span id="scoreL">Score</span><b id="score">0</b></div>
        <div class="box"><span id="bestL">Best</span><b id="best">0</b></div>
        <div class="box next"><span id="nextL">Next</span><canvas id="nextCv" width="96" height="96"></canvas></div>
      </div>
      <div id="tools">
        <button id="hammerBtn" class="tool ad"><i class="adi"></i><svg viewBox="0 0 24 24"><path d="M4 20l9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="11" y="3" width="10" height="7" rx="1.5" transform="rotate(45 16 6.5)" fill="currentColor"/></svg><span id="hammerTxt">Smash</span></button>
        <button id="shakeBtn" class="tool ad"><i class="adi"></i><svg viewBox="0 0 24 24"><path d="M3 12c2-3 4 3 6 0s4 3 6 0 4 3 6 0" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M3 7c2-3 4 3 6 0s4 3 6 0 4 3 6 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/></svg><span id="shakeTxt">Shake</span></button>
      </div>
      <div id="pop"></div>
      <div id="banner" class="hide"></div>
    </div>
    <button id="signBtn" class="hide"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/></svg><span id="signTxt">Sign in</span></button>
    <button id="pauseBtn" class="hide" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button>
    <div id="pauseScr" class="screen hide">
      <div class="card">
        <div id="pauseT" class="dtitle"></div>
        <button id="resumeBtn" class="big"></button>
        <button id="restartBtn" class="sec2"></button>
        <button id="signBtn2" class="sec2 hide"></button>
      </div>
    </div>
    <div id="over" class="screen hide">
      <div class="card">
        <div id="overT" class="cause"></div>
        <div id="overTitle" class="dtitle"></div>
        <canvas id="bigCv" width="320" height="220"></canvas>
        <div id="bigName" class="bigName"></div>
        <div id="newBest" class="newbest hide"></div>
        <div class="dstats">
          <div><b id="oScore"></b><span id="oScoreL"></span></div>
          <div><b id="oBest"></b><span id="oBestL"></span></div>
          <div><b id="oMerges"></b><span id="oMergesL"></span></div>
        </div>
        <button id="reviveBtn" class="ad big2"><i class="adi"></i><span><span id="reviveTxt"></span><small id="reviveSub"></small></span></button>
        <button id="againBtn" class="big"></button>
        <div id="shareHint" class="hint"></div>
      </div>
    </div>
    <button id="mute" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="muteWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path id="muteX" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
